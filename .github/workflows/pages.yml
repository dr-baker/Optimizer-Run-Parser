name: Deploy to gh-pages branch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare public directory
        run: |
          mkdir -p public
          cp -v index.html public/
          cp -v script.js public/
          cp -v styles.css public/
          if [ -f example_json.json ]; then cp -v example_json.json public/; fi
          if [ -f .nojekyll ]; then cp -v .nojekyll public/; fi
          echo "Prepared files:" && ls -la public

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true


